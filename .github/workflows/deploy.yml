# 推送到 main 分支時，自動編譯並發布到 GitHub Pages
name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 檢查 Supabase 設定
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::請到 GitHub → Settings → Secrets and variables → Actions 新增 VITE_SUPABASE_URL 與 VITE_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          if ! printf '%s' "$VITE_SUPABASE_URL" | grep -Eq '^https://[a-z0-9]+\.supabase\.co/?$'; then
            echo "::error::VITE_SUPABASE_URL 格式不正確（不可有空格），應該像 https://xxxx.supabase.co"; exit 1
          fi
          if ! printf '%s' "$VITE_SUPABASE_PUBLISHABLE_KEY" | grep -Eq '^(sb_publishable_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9._-]+)$'; then
            echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY 格式不正確：不可有空格或換行，應以 sb_publishable_ 開頭"; exit 1
          fi
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
            sb_secret_*|*service_role*) echo "::error::不可以使用私密金鑰，請改用 publishable key"; exit 1 ;;
          esac
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
